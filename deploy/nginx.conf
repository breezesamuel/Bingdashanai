# 丙大山AI · nginx 反向代理 + HTTPS
# 放置路径：/etc/nginx/sites-available/bingdashan.conf  → ln -s 到 sites-enabled/
# 用途：对外只开 80/443；Node 只监听 127.0.0.1:3721。
#
# ⚠ 必须带上 X-Forwarded-For / X-Real-IP：server.js 的 isLoopback() 会因这些头
#   把请求判定为「非本机」，从而要求管理令牌。绝不能省略，否则公网访客会被
#   当成运营本人（收费墙与运营接口对全世界敞开）。

server {
    listen 80;
  listen [::]:80;
  server_name bingdashanai.highkingflower.com;

  # Let's Encrypt 域名校验
  location /.well-known/acme-challenge/ { root /var/www/certbot; }

  location / { return 301 https://$host$request_uri; }
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name bingdashanai.highkingflower.com;

  ssl_certificate     /etc/letsencrypt/live/bingdashanai.highkingflower.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/bingdashanai.highkingflower.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers HIGH:!aNULL:!MD5;

  client_max_body_size 25m;

  # SSE / 长轮询：关掉缓冲
  proxy_buffering off;
  proxy_read_timeout 300s;
  proxy_send_timeout 300s;

  location / {
    proxy_pass http://127.0.0.1:3721;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        "upgrade";
  }
}
