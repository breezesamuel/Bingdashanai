services:
  - type: web
    name: bingdashan-ai
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: HOST
        value: 0.0.0.0
      - key: TZ
        value: Asia/Shanghai
    autoDeploy: true
